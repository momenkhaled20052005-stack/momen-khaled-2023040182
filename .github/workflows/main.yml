#name: momen-khaled-id-2023040182 

name: Docker Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }} 
        password: ${{ secrets.DOCKER_HUB_TOKEN }} 
      
    - name: Build the Docker Image
      run: docker build . --tag ${{ secrets.DOCKER_HUB_USERNAME }}/momen_khaled_2023040182:latest
      
    - name: Push the Image
      run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/momen_khaled_2023040182:latest